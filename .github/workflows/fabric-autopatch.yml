name: One-shot tuner fabric integration

on:
  push:
    branches:
      - feat/distributed-tuner-fabric

permissions:
  contents: write

concurrency:
  group: fabric-autopatch
  cancel-in-progress: false

jobs:
  patch-check-commit:
    if: ${{ !contains(github.event.head_commit.message, '[fabric-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/distributed-tuner-fabric
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev clang pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact-match integration patches
        run: |
          python3 scripts/fabric_autopatch.py
          python3 scripts/fabric_autopatch_safety.py

      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Compile recisdb-proxy library
        run: cargo check -p recisdb-proxy --lib

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/fabric_autopatch.py
          rm scripts/fabric_autopatch_safety.py
          rm .github/workflows/fabric-autopatch.yml

      - name: Commit integrated changes
        run: |
          git config user.name "recisdb-fabric-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[fabric-autopatch] fix tuner arbitration and claim consistency"
          git push origin HEAD:feat/distributed-tuner-fabric
