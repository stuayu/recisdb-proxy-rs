name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create a release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build_tsreadex:
    needs: create_release
    permissions:
      contents: write
    uses: ./.github/workflows/tsreadex.yml
    with:
      upload_url: ${{ needs.create_release.outputs.upload_url }}
      asset_version: ${{ github.ref_name }}
    secrets: inherit

  release_deb_executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            label: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            label: linux-arm64
    runs-on: ${{ matrix.os }}
    needs: create_release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .github/workflows/
          tags: ubuntu:build
          platforms: ${{ matrix.platform }}
          build-args: IMAGE=ubuntu:22.04
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,scope=ubuntu,mode=max
          load: true
      - name: Create deb packages
        run: |
          docker run --rm -i -v "$(pwd):/work" -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo deb -p recisdb --output ./artifacts/ -- -F dvb'
      - name: Build proxy binaries
        env:
          # Picked up by recisdb-proxy/build.rs (priority 1, overrides `git
          # describe`) — a shallow `actions/checkout` (default fetch-depth=1)
          # doesn't reliably carry tag history into the container for `git
          # describe` to find, so the tag is passed explicitly. Leading `v`
          # (tags may be `v0.0.1-alpha.6` or `0.0.1-alpha.6`) is stripped by
          # build.rs itself.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: |
          docker run --rm -i -e RECISDB_PROXY_VERSION -v "$(pwd):/work" -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo build --release -p recisdb-proxy -p recisdb -F recisdb/dvb'
      - name: Package proxy tarball
        run: |
          # docker run creates artifacts/ and target/ as root
          sudo chown -R "$(id -u):$(id -g)" artifacts target
          STAGE="recisdb-proxy-${{ github.ref_name }}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          for name in recisdb-proxy recisdb recisdb-proxy-setup; do
            test -x "target/release/$name" || {
              echo "Required Linux update bundle file is missing: target/release/$name" >&2
              exit 1
            }
            cp "target/release/$name" "$STAGE/"
          done
          cp recisdb-proxy/recisdb-proxy.toml.example "$STAGE/"
          [ -f recisdb-proxy/recisdb-proxy-rs.service ] && cp recisdb-proxy/recisdb-proxy-rs.service "$STAGE/"
          tar czf "artifacts/$STAGE.tar.gz" "$STAGE"
          ls -la artifacts/
      - name: Upload packages to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./artifacts/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}

  release_macos_executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            label: macos-amd64
          - runner: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    needs: create_release
    steps:
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # This workflow only ever runs from a tag ref, and Actions caches are
          # scoped to the ref that wrote them: a cache saved by
          # refs/tags/v0.0.1-alpha.12 is invisible to v0.0.1-alpha.13, so
          # saving here produces a cache nothing can ever read. Restore from
          # what build.yml saved on the default branch instead.
          #
          # `shared-key` (not `key`) is what makes that possible: rust-cache
          # folds the job name into `key`, and this job is named differently
          # from build.yml's, so `key` alone would never match no matter which
          # ref it ran on. `shared-key` replaces the job-name component
          # outright. Keep this value in sync with build.yml's build-macos job.
          shared-key: ${{ matrix.label }}
          save-if: false
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build proxy binaries
        env:
          # See the Linux job's "Build proxy binaries" step for why the tag is
          # passed explicitly instead of relying on build.rs's `git describe`.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: cargo build --release -p recisdb-proxy -p recisdb
      - name: Package proxy tarball
        run: |
          # The archive layout must match what the self-update endpoint
          # expects: a single top-level directory containing `recisdb-proxy`.
          # See `UNIX_BUNDLE_FILES` in web/api/update.rs.
          STAGE="recisdb-proxy-${{ github.ref_name }}-${{ matrix.label }}"
          mkdir -p artifacts "$STAGE"
          for name in recisdb-proxy recisdb recisdb-proxy-setup; do
            test -x "target/release/$name" || {
              echo "Required macOS update bundle file is missing: target/release/$name" >&2
              exit 1
            }
            cp "target/release/$name" "$STAGE/"
          done
          cp recisdb-proxy/recisdb-proxy.toml.example "$STAGE/"
          tar czf "artifacts/$STAGE.tar.gz" "$STAGE"
          ls -la artifacts/
      - name: Upload packages to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./artifacts/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}

  release_windows_exe:
    runs-on: windows-2025
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-pc-windows-msvc
            label: win-x64
          - arch: i686-pc-windows-msvc
            label: win-x86
          - arch: aarch64-pc-windows-msvc
            label: win-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - uses: fbactions/setup-winsdk@v2
      # CMake はランナー同梱のものを使う (build.yml の同じ位置のコメント参照)。
      # 旧版に固定すると "Visual Studio 18 2026" ジェネレーターを作れずビルドが落ちる。
      # MSVC ツールセットは VS 2026 既定の 14.51 をそのまま使う。14.4x (v143) への
      # 固定も試したが、VS 2026 のイメージには v143 の ARM64 ターゲットが無く
      # win-arm64 が MSB8020 で必ず落ちる。14.51 で libaribb25 が ARM64 で壊れる件は
      # b25-sys/build.rs 側のソースパッチ (multi2_simd) で解消済み。

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Restore-only, keyed to match build.yml's build-windows job — see
          # the release_macos_executable job's Rust cache step for why.
          shared-key: ${{ matrix.label }}
          save-if: false

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Build
        env:
          # See the Linux job's "Build proxy binaries" step for why this is
          # set explicitly rather than relying on build.rs's `git describe`
          # fallback.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: |
          rustup target add ${{ matrix.arch }}
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo build --workspace --release --target ${{ matrix.arch }}

      - name: Package release assets
        shell: pwsh
        run: |
          $targetDir = "target/${{ matrix.arch }}/release"
          $stage = "recisdb-${{ github.ref_name }}-${{ matrix.label }}"
          $outDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $stage, $outDir

          # Keep the self-update contract in sync with update.rs. Publishing a
          # partial archive would leave installed components on mixed versions,
          # so fail the release before creating any assets.
          $required = @(
            "recisdb-proxy.exe",
            "recisdb.exe",
            "recisdb-proxy-setup.exe",
            "BonDriver_NetworkProxy.dll"
          )
          foreach ($name in $required) {
            $source = Join-Path $targetDir $name
            if (!(Test-Path $source)) {
              throw "Required Windows update bundle file is missing: $source"
            }
            Copy-Item $source "$stage/"
          }
          Copy-Item "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$stage/"
          Copy-Item "recisdb-proxy/recisdb-proxy.toml.example" "$stage/"

          Compress-Archive -Path $stage -DestinationPath "$outDir/$stage.zip"
          # Standalone CLI exe with the historical asset name
          Copy-Item "$targetDir/recisdb.exe" "$outDir/recisdb-${{ matrix.arch }}.exe"
          Get-ChildItem $outDir

      - name: Upload assets to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./release-assets/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}
