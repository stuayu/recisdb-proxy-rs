name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create a release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build_tsreadex:
    needs: create_release
    permissions:
      contents: write
    uses: ./.github/workflows/tsreadex.yml
    with:
      upload_url: ${{ needs.create_release.outputs.upload_url }}
      asset_version: ${{ github.ref_name }}
    secrets: inherit

  release_deb_executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            label: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            label: linux-arm64
    runs-on: ${{ matrix.os }}
    needs: create_release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .github/workflows/
          tags: ubuntu:build
          platforms: ${{ matrix.platform }}
          build-args: IMAGE=ubuntu:22.04
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,scope=ubuntu,mode=max
          load: true
      - name: Create deb packages
        run: |
          docker run --rm -i -v "$(pwd):/work" -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo deb -p recisdb --output ./artifacts/ -- -F dvb'
      - name: Build proxy binaries
        env:
          # Picked up by recisdb-proxy/build.rs (priority 1, overrides `git
          # describe`) — a shallow `actions/checkout` (default fetch-depth=1)
          # doesn't reliably carry tag history into the container for `git
          # describe` to find, so the tag is passed explicitly. Leading `v`
          # (tags may be `v0.0.1-alpha.6` or `0.0.1-alpha.6`) is stripped by
          # build.rs itself.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: |
          docker run --rm -i -e RECISDB_PROXY_VERSION -v "$(pwd):/work" -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo build --release -p recisdb-proxy'
      - name: Package proxy tarball
        run: |
          # docker run creates artifacts/ and target/ as root
          sudo chown -R "$(id -u):$(id -g)" artifacts target
          STAGE="recisdb-proxy-${{ github.ref_name }}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp target/release/recisdb-proxy "$STAGE/"
          cp target/release/recisdb-proxy-setup "$STAGE/"
          cp recisdb-proxy/recisdb-proxy.toml.example "$STAGE/"
          [ -f recisdb-proxy/recisdb-proxy-rs.service ] && cp recisdb-proxy/recisdb-proxy-rs.service "$STAGE/"
          tar czf "artifacts/$STAGE.tar.gz" "$STAGE"
          ls -la artifacts/
      - name: Upload packages to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./artifacts/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}

  release_macos_executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            label: macos-amd64
          - runner: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    needs: create_release
    steps:
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build proxy binaries
        env:
          # See the Linux job's "Build proxy binaries" step for why the tag is
          # passed explicitly instead of relying on build.rs's `git describe`.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: cargo build --release -p recisdb-proxy
      - name: Package proxy tarball
        run: |
          # The archive layout must match what the self-update endpoint
          # expects: a single top-level directory containing `recisdb-proxy`.
          # See `is_target_binary_entry` in web/api/update.rs.
          STAGE="recisdb-proxy-${{ github.ref_name }}-${{ matrix.label }}"
          mkdir -p artifacts "$STAGE"
          cp target/release/recisdb-proxy "$STAGE/"
          cp target/release/recisdb-proxy-setup "$STAGE/"
          cp recisdb-proxy/recisdb-proxy.toml.example "$STAGE/"
          tar czf "artifacts/$STAGE.tar.gz" "$STAGE"
          ls -la artifacts/
      - name: Upload packages to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./artifacts/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}

  release_windows_exe:
    runs-on: windows-2025
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-pc-windows-msvc
            label: win-x64
          - arch: i686-pc-windows-msvc
            label: win-x86
          - arch: aarch64-pc-windows-msvc
            label: win-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - uses: fbactions/setup-winsdk@v2
      # libaribb25 が CMake 4.x 非対応のため 3.31 系に固定する。
      - name: Setup CMake (pinned)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'
      # windows ランナーのイメージに VS 2022 が存在しないことがあるので、ジェネレーターではなく
      # 「実在する MSVC ツールセット」を検出して 14.4x (v143) があればそれを使う。
      # 14.51 (VS 2026 / MSVC 19.51 preview) だと tsreadex は C2664、libaribb25 は
      # ARM64 で大量のコンパイルエラーになる。
      - name: Detect MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::warning::vswhere.exe not found; using the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
            exit 0
          }
          $installs = & $vswhere -products * -prerelease -format json | ConvertFrom-Json
          $toolsets = @()
          foreach ($i in $installs) {
            Write-Host "VS: $($i.displayName) $($i.installationVersion) -> $($i.installationPath)"
            $dir = Join-Path $i.installationPath 'VC\Tools\MSVC'
            if (Test-Path $dir) {
              foreach ($d in Get-ChildItem $dir -Directory) {
                Write-Host "  toolset: $($d.Name)"
                $toolsets += $d.Name
              }
            }
          }
          $pick = $toolsets | Where-Object { $_ -like '14.4*' } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($pick) {
            Write-Host "selected MSVC toolset: $pick"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset=version=$pick"
          } else {
            Write-Host "::warning::no 14.4x toolset on this image; falling back to the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Build
        env:
          # See the Linux job's "Build proxy binaries" step for why this is
          # set explicitly rather than relying on build.rs's `git describe`
          # fallback.
          RECISDB_PROXY_VERSION: ${{ github.ref_name }}
        run: |
          rustup target add ${{ matrix.arch }}
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          # b25-sys/build.rs は CMAKE_GENERATOR_TOOLSET を cmake の -T に渡す。
          $toolset = "${{ steps.msvc.outputs.toolset }}"
          if ($toolset) { $env:CMAKE_GENERATOR_TOOLSET = $toolset }
          cargo build --workspace --release --target ${{ matrix.arch }}

      - name: Package release assets
        shell: pwsh
        run: |
          $targetDir = "target/${{ matrix.arch }}/release"
          $stage = "recisdb-${{ github.ref_name }}-${{ matrix.label }}"
          $outDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $stage, $outDir

          Copy-Item "$targetDir/recisdb.exe" "$stage/"
          Copy-Item "$targetDir/recisdb-proxy.exe" "$stage/"
          Copy-Item "$targetDir/recisdb-proxy-setup.exe" "$stage/"
          Copy-Item "$targetDir/BonDriver_NetworkProxy.dll" "$stage/"
          Copy-Item "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$stage/"
          Copy-Item "recisdb-proxy/recisdb-proxy.toml.example" "$stage/"

          Compress-Archive -Path $stage -DestinationPath "$outDir/$stage.zip"
          # Standalone CLI exe with the historical asset name
          Copy-Item "$targetDir/recisdb.exe" "$outDir/recisdb-${{ matrix.arch }}.exe"
          Get-ChildItem $outDir

      - name: Upload assets to release channel
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "./release-assets/*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create_release.outputs.upload_url }}
