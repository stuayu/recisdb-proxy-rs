name: Tests at Merging

on:
  schedule:
  - cron: 0 0 * * *
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install PCSC, udev, dvbv5, build-essential, cmake, clang, pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev clang pkg-config -qy
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Clippy (recisdb-proxy lib)
        run: cargo clippy -p recisdb-proxy --lib --no-deps -- -W warnings
        continue-on-error: true

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:sid-slim
          - debian:testing-slim
          - debian:stable-slim
          - ubuntu:noble
          # - alpine:latest
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install PCSC, udev, dvbv5, git, build-essential, cmake, wget, clang, pkg-config
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # curl + ca-certificates are required by dtolnay/rust-toolchain to download rustup
          apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev git wget curl ca-certificates clang pkg-config -qy
        if: matrix.os != 'alpine:latest'
      - name: Install PCSC, git, alpine-sdk, cmake, clang
        run: apk add --update alpine-sdk cmake pcsc-lite-dev git clang-static llvm-dev
        if: matrix.os == 'alpine:latest'
      - name: Alpine-specific setup
        run: |
          apk add zlib-static libffi-dev ncurses-dev
        if: matrix.os == 'alpine:latest'
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Check
        run: cargo check --workspace -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Check
        run: cargo check --workspace --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'

  build-windows-non-msys:
    runs-on: windows-2025
    steps:
      - uses: fbactions/setup-winsdk@v2
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-windows-non-msys
      - name: Test
        run: |
          rustup target add x86_64-pc-windows-gnu
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo test --workspace --release --target x86_64-pc-windows-gnu

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable-x86_64-pc-windows-gnu
          - stable-x86_64-pc-windows-msvc
          - stable-i686-pc-windows-gnu
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        if: endsWith(matrix.toolchain, 'msvc')
      - uses: fbactions/setup-winsdk@v2
        if: endsWith(matrix.toolchain, 'msvc')
      # MSVC 経路のみ: libaribb25 が CMake 4.x 非対応なので 3.31 系に固定する
      # (MinGW 経路は msys2 の cmake/ninja を使うため触らない)。
      - name: Setup CMake (pinned)
        uses: jwlawson/actions-setup-cmake@v2
        if: endsWith(matrix.toolchain, 'msvc')
        with:
          cmake-version: '3.31.x'

      - uses: msys2/setup-msys2@v2
        if: endsWith(matrix.toolchain, 'gnu')
        with:
          msystem: mingw64
          update: true
          pacboy: >-
            git:
            clang:p
            cmake:p
            ninja:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # windows ランナーのイメージに VS 2022 が存在しないことがあるので、ジェネレーターではなく
      # 「実在する MSVC ツールセット」を検出して 14.4x (v143) があればそれを使う。
      # 14.51 (VS 2026 / MSVC 19.51 preview) だと tsreadex は C2664、libaribb25 は
      # ARM64 で大量のコンパイルエラーになる。
      - name: Detect MSVC toolset
        id: msvc
        if: endsWith(matrix.toolchain, 'msvc')
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::warning::vswhere.exe not found; using the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
            exit 0
          }
          $installs = & $vswhere -products * -prerelease -format json | ConvertFrom-Json
          $toolsets = @()
          foreach ($i in $installs) {
            Write-Host "VS: $($i.displayName) $($i.installationVersion) -> $($i.installationPath)"
            $dir = Join-Path $i.installationPath 'VC\Tools\MSVC'
            if (Test-Path $dir) {
              foreach ($d in Get-ChildItem $dir -Directory) {
                Write-Host "  toolset: $($d.Name)"
                $toolsets += $d.Name
              }
            }
          }
          $pick = $toolsets | Where-Object { $_ -like '14.4*' } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($pick) {
            Write-Host "selected MSVC toolset: $pick"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset=version=$pick"
          } else {
            Write-Host "::warning::no 14.4x toolset on this image; falling back to the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Check(MSVC)
        if: endsWith(matrix.toolchain, 'msvc')
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          # 検出できた 14.4x ツールセットを cmake の -T に渡す。
          $toolset = "${{ steps.msvc.outputs.toolset }}"
          if ($toolset) { $env:CMAKE_GENERATOR_TOOLSET = $toolset }
          cargo check --workspace
      - name: Run tests(MSVC)
        if: endsWith(matrix.toolchain, 'msvc')
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          $toolset = "${{ steps.msvc.outputs.toolset }}"
          if ($toolset) { $env:CMAKE_GENERATOR_TOOLSET = $toolset }
          cargo test --workspace

      - name: Check(MinGW)
        shell: msys2 {0}
        if: endsWith(matrix.toolchain, 'gnu')
        run: export PATH=$PATH:/c/Users/runneradmin/.cargo/bin && cargo check --workspace
      - name: Run tests(MinGW)
        shell: msys2 {0}
        if: endsWith(matrix.toolchain, 'gnu')
        run: export PATH=$PATH:/c/Users/runneradmin/.cargo/bin && cargo test --workspace
