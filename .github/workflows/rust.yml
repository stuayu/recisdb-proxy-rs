name: Tests at Merging

on:
  schedule:
  - cron: 0 0 * * *
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install PCSC, udev, dvbv5, build-essential, cmake, clang, pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev clang pkg-config -qy
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Clippy (recisdb-proxy lib)
        run: cargo clippy -p recisdb-proxy --lib --no-deps -- -W warnings
        continue-on-error: true

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:sid-slim
          - debian:testing-slim
          - debian:stable-slim
          - ubuntu:noble
          # Alpine's matrix entry has been disabled since 2023; this job
          # currently validates Debian/Ubuntu Linux environments only.
          # - alpine:latest
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install PCSC, udev, dvbv5, git, build-essential, cmake, wget, clang, pkg-config
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # curl + ca-certificates are required by dtolnay/rust-toolchain to download rustup
          apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev git wget curl ca-certificates clang pkg-config -qy
      - name: Install FFmpeg with libx264/libx265 for preview regressions
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install ffmpeg -qy
          command -v ffprobe >/dev/null
          encoders="$(ffmpeg -hide_banner -encoders)"
          printf '%s\n' "$encoders" | awk '$2 == "libx264" { x264=1 } $2 == "libx265" { x265=1 } END { exit !(x264 && x265) }'
          echo "RECISDB_REQUIRE_FFMPEG_FIXTURES=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Check
        run: cargo check --workspace -F dvb
      - name: Run tests
        run: cargo test --workspace -F dvb

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: b25-sys-macos
      - name: Test macOS PC/SC and PX4 paths
        run: cargo test -p b25-sys -- --test-threads=1

  build-windows-non-msys:
    runs-on: windows-2025
    steps:
      - uses: fbactions/setup-winsdk@v2
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-windows-non-msys
      - name: Install FFmpeg fixtures with libx264 and libx265
        shell: pwsh
        run: |
          choco install ffmpeg-full --version=9.0.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "choco install ffmpeg-full failed with exit code $LASTEXITCODE"
          }

          $toolsPath = Join-Path $env:ChocolateyInstall "lib\ffmpeg-full\tools"
          $ffmpeg = Get-ChildItem -Path $toolsPath -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "Chocolatey installed ffmpeg-full without ffmpeg.exe under $toolsPath"
          }
          $ffmpegDirectory = $ffmpeg.DirectoryName
          $ffprobePath = Join-Path $ffmpegDirectory "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobePath -PathType Leaf)) {
            throw "ffprobe.exe is missing beside $($ffmpeg.FullName)"
          }

          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -encoders failed with exit code $LASTEXITCODE"
          }

          foreach ($encoder in @("libx264", "libx265")) {
            $pattern = '(?m)^\s*V\S*\s+' + [regex]::Escape($encoder) + '(\s|$)'
            if ($encoders -notmatch $pattern) {
              throw "FFmpeg does not provide the required $encoder encoder"
            }
          }

          $ffprobeVersion = & $ffprobePath -version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe failed with exit code $LASTEXITCODE"
          }
          $ffprobeVersion | Select-Object -First 1

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDirectory -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RECISDB_REQUIRE_FFMPEG_FIXTURES=1" -Encoding utf8
      - name: Test
        run: |
          rustup target add x86_64-pc-windows-gnu
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo test --workspace --release --target x86_64-pc-windows-gnu

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable-x86_64-pc-windows-gnu
          - stable-x86_64-pc-windows-msvc
          - stable-i686-pc-windows-gnu
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        if: endsWith(matrix.toolchain, 'msvc')
      - uses: fbactions/setup-winsdk@v2
        if: endsWith(matrix.toolchain, 'msvc')
      - uses: msys2/setup-msys2@v2
        if: endsWith(matrix.toolchain, 'gnu')
        with:
          msystem: mingw64
          update: true
          pacboy: >-
            git:
            clang:p
            cmake:p
            ninja:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # CMake / MSVC ツールセットはランナー同梱のものをそのまま使う。
      # CMake を旧版に固定するとイメージ唯一の VS 2026 向けジェネレーターを作れず、
      # ツールセットを 14.4x (v143) に固定すると ARM64 ターゲットが無くて落ちる。
      # 詳細は build.yml の同じ位置のコメントを参照。

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Check(MSVC)
        if: endsWith(matrix.toolchain, 'msvc')
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo check --workspace
      - name: Run tests(MSVC)
        if: endsWith(matrix.toolchain, 'msvc')
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo test --workspace

      - name: Check(MinGW)
        shell: msys2 {0}
        if: endsWith(matrix.toolchain, 'gnu')
        run: export PATH=$PATH:/c/Users/runneradmin/.cargo/bin && cargo check --workspace
      - name: Run tests(MinGW)
        shell: msys2 {0}
        if: endsWith(matrix.toolchain, 'gnu')
        run: export PATH=$PATH:/c/Users/runneradmin/.cargo/bin && cargo test --workspace
