name: Build and Upload Artifacts

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-control-autopatch:
    if: ${{ github.ref == 'refs/heads/feat/distributed-node-control' && !contains(github.event.head_commit.message, '[node-autopatch]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/distributed-node-control
          fetch-depth: 2
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libpcsclite-dev libudev-dev libdvbv5-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact route wiring
        run: |
          python3 scripts/node_control_autopatch.py
          cargo fmt --all
          git diff --check

      - name: Check Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Check Rust API
        run: cargo check -p recisdb-proxy --lib -F dvb

      - name: Restore normal CI and remove staging script
        run: |
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f scripts/node_control_autopatch.py

      - name: Commit wired implementation
        run: |
          git config user.name "recisdb-fabric-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[node-autopatch] wire distributed node API and dashboard"
          git push origin HEAD:feat/distributed-node-control
