name: Build and Upload Artifacts

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-pc-windows-msvc
            label: win-x64
          - arch: i686-pc-windows-msvc
            label: win-x86
          - arch: aarch64-pc-windows-msvc
            label: win-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup Windows SDK
        uses: fbactions/setup-winsdk@v2

      # CMake はランナー同梱のものを使う。イメージに入っているのは VS 2026 のみで、
      # b25-sys (cmake-rs) はそれを見て "Visual Studio 18 2026" ジェネレーターを
      # 要求するため、そのジェネレーターを知らない旧版 (3.31 系など) に固定すると
      # "Could not create named generator" でビルドできない。
      # libaribb25 の古い CMakeLists と CMake 4.x の非互換は、b25-sys/build.rs が
      # CMAKE_POLICY_VERSION_MINIMUM=3.5 を渡すことで回避している。

      # windows ランナーのイメージに VS 2022 が存在しないことがあるので、ジェネレーターではなく
      # 「実在する MSVC ツールセット」を検出して 14.4x (v143) があればそれを使う。
      # 14.51 (VS 2026 / MSVC 19.51 preview) だと tsreadex は C2664、libaribb25 は
      # ARM64 で大量のコンパイルエラーになる。
      - name: Detect MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::warning::vswhere.exe not found; using the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
            exit 0
          }
          $installs = & $vswhere -products * -prerelease -format json | ConvertFrom-Json
          $toolsets = @()
          foreach ($i in $installs) {
            Write-Host "VS: $($i.displayName) $($i.installationVersion) -> $($i.installationPath)"
            $dir = Join-Path $i.installationPath 'VC\Tools\MSVC'
            if (Test-Path $dir) {
              foreach ($d in Get-ChildItem $dir -Directory) {
                Write-Host "  toolset: $($d.Name)"
                $toolsets += $d.Name
              }
            }
          }
          $pick = $toolsets | Where-Object { $_ -like '14.4*' } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          if ($pick) {
            Write-Host "selected MSVC toolset: $pick"
            # -T は「世代名,version=詳細版」で指定する。version= だけだと
            # ジェネレーター既定の世代 (VS 2026 なら v145) の中から探してしまい、
            # v143 世代である 14.4x を渡すと "invalid version specification" になる。
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset=v143,version=$pick"
          } else {
            Write-Host "::warning::no 14.4x toolset on this image; falling back to the default toolset"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset="
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Build (Release)
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          # b25-sys/build.rs は CMAKE_GENERATOR_TOOLSET を cmake の -T に渡す。
          $toolset = "${{ steps.msvc.outputs.toolset }}"
          if ($toolset) { $env:CMAKE_GENERATOR_TOOLSET = $toolset }
          cargo build --workspace --release --target ${{ matrix.arch }}

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $targetDir = "target/${{ matrix.arch }}/release"
          $outDir = "artifacts-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $outDir

          # Copy only the built binaries (exe/dll) and their debug symbols;
          # $targetDir also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          Copy-Item "$targetDir/*.exe" "$outDir/" -ErrorAction SilentlyContinue
          Copy-Item "$targetDir/*.dll" "$outDir/" -ErrorAction SilentlyContinue
          Copy-Item "$targetDir/*.pdb" "$outDir/" -ErrorAction SilentlyContinue

          # Copy sample config if exists
          if (Test-Path "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample") {
            Copy-Item "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$outDir/"
          }
          if (Test-Path "recisdb-proxy/recisdb-proxy.toml.example") {
            Copy-Item "recisdb-proxy/recisdb-proxy.toml.example" "$outDir/"
          }

          Get-ChildItem $outDir

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/

  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-unknown-linux-gnu
            label: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
            label: linux-arm64

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libpcsclite-dev libudev-dev libdvbv5-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxrandr-dev \
            libxi-dev libxcursor-dev libwayland-dev libgl1-mesa-dev

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build (Release)
        run: cargo build --workspace --release -F dvb

      - name: Prepare artifacts
        run: |
          TARGET_DIR="target/release"
          OUT_DIR="artifacts-${{ matrix.label }}"
          mkdir -p "$OUT_DIR"

          # Copy only the built executables and shared libraries;
          # $TARGET_DIR also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          find "$TARGET_DIR" -maxdepth 1 -type f -perm -u+x ! -name '*.*' -exec cp {} "$OUT_DIR/" \;
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*.so' -exec cp {} "$OUT_DIR/" \;

          # Copy sample configs
          [ -f "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" ] && cp "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy.toml.example" ] && cp "recisdb-proxy/recisdb-proxy.toml.example" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy-rs.service" ] && cp "recisdb-proxy/recisdb-proxy-rs.service" "$OUT_DIR/"

          ls -la "$OUT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/
          retention-days: 30

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            label: macos-amd64
          - runner: macos-26
            label: macos-arm64

    steps:
      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build (Release)
        run: cargo build --workspace --release

      - name: Prepare artifacts
        run: |
          TARGET_DIR="target/release"
          OUT_DIR="artifacts-${{ matrix.label }}"
          mkdir -p "$OUT_DIR"

          # Copy only the built executables and shared libraries;
          # $TARGET_DIR also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          find "$TARGET_DIR" -maxdepth 1 -type f -perm -u+x ! -name '*.*' -exec cp {} "$OUT_DIR/" \;
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*.dylib' -exec cp {} "$OUT_DIR/" \;

          # Copy sample configs
          [ -f "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" ] && cp "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy.toml.example" ] && cp "recisdb-proxy/recisdb-proxy.toml.example" "$OUT_DIR/"

          ls -la "$OUT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/
          retention-days: 30
