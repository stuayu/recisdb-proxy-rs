name: Build and Upload Artifacts

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-pc-windows-msvc
            label: win-x64
          - arch: i686-pc-windows-msvc
            label: win-x86

    steps:
      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup Windows SDK
        uses: fbactions/setup-winsdk@v2

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Build (Release)
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo build --workspace --release --target ${{ matrix.arch }}

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $targetDir = "target/${{ matrix.arch }}/release"
          $outDir = "artifacts-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $outDir

          # Copy only the built binaries (exe/dll) and their debug symbols;
          # $targetDir also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          Copy-Item "$targetDir/*.exe" "$outDir/" -ErrorAction SilentlyContinue
          Copy-Item "$targetDir/*.dll" "$outDir/" -ErrorAction SilentlyContinue
          Copy-Item "$targetDir/*.pdb" "$outDir/" -ErrorAction SilentlyContinue

          # Copy sample config if exists
          if (Test-Path "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample") {
            Copy-Item "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$outDir/"
          }
          if (Test-Path "recisdb-proxy/recisdb-proxy.toml.example") {
            Copy-Item "recisdb-proxy/recisdb-proxy.toml.example" "$outDir/"
          }

          Get-ChildItem $outDir

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/

  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-unknown-linux-gnu
            label: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
            label: linux-arm64

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config \
            libpcsclite-dev libudev-dev libdvbv5-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libxrandr-dev \
            libxi-dev libxcursor-dev libwayland-dev libgl1-mesa-dev

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build (Release)
        run: cargo build --workspace --release -F dvb

      - name: Prepare artifacts
        run: |
          TARGET_DIR="target/release"
          OUT_DIR="artifacts-${{ matrix.label }}"
          mkdir -p "$OUT_DIR"

          # Copy only the built executables and shared libraries;
          # $TARGET_DIR also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          find "$TARGET_DIR" -maxdepth 1 -type f -perm -u+x ! -name '*.*' -exec cp {} "$OUT_DIR/" \;
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*.so' -exec cp {} "$OUT_DIR/" \;

          # Copy sample configs
          [ -f "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" ] && cp "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy.toml.example" ] && cp "recisdb-proxy/recisdb-proxy.toml.example" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy-rs.service" ] && cp "recisdb-proxy/recisdb-proxy-rs.service" "$OUT_DIR/"

          ls -la "$OUT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/
          retention-days: 30

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            label: macos-amd64
          - runner: macos-26
            label: macos-arm64

    steps:
      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: Build Web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build
      - name: Build (Release)
        run: cargo build --workspace --release

      - name: Prepare artifacts
        run: |
          TARGET_DIR="target/release"
          OUT_DIR="artifacts-${{ matrix.label }}"
          mkdir -p "$OUT_DIR"

          # Copy only the built executables and shared libraries;
          # $TARGET_DIR also holds deps/build/incremental/.fingerprint, which
          # are compiler intermediates, not distributable artifacts.
          find "$TARGET_DIR" -maxdepth 1 -type f -perm -u+x ! -name '*.*' -exec cp {} "$OUT_DIR/" \;
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*.dylib' -exec cp {} "$OUT_DIR/" \;

          # Copy sample configs
          [ -f "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" ] && cp "bondriver-proxy-client/BonDriver_NetworkProxy.ini.sample" "$OUT_DIR/"
          [ -f "recisdb-proxy/recisdb-proxy.toml.example" ] && cp "recisdb-proxy/recisdb-proxy.toml.example" "$OUT_DIR/"

          ls -la "$OUT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: recisdb-${{ matrix.label }}
          path: artifacts-${{ matrix.label }}/
          retention-days: 30
