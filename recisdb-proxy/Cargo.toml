[package]
name = "recisdb-proxy"
version = "0.1.0"
authors = ["maleicacid <maleicacid824+dev@gmail.com>"]
edition = "2021"
description = "Network proxy server for recisdb BonDriver"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kazuki0824/recisdb-rs.git"
build = "build.rs"

[[bin]]
name = "recisdb-proxy"
path = "src/main.rs"

[[bin]]
name = "recisdb-proxy-setup"
path = "src/setup_gui.rs"

[features]
default = ["webhook"]
tls = ["tokio-rustls", "rustls", "rustls-pemfile"]
# reqwest is now a required dependency (self-update / GitHub release checker,
# web/api/update.rs, needs it unconditionally), so this feature no longer
# gates it. Kept as a (currently empty) feature so existing
# `#[cfg(feature = "webhook")]` gates elsewhere (alert.rs, px4_installer.rs)
# keep compiling unchanged.
webhook = []

[dependencies]
recisdb-protocol = { path = "../recisdb-protocol" }
# TODO: recisdb integration requires build.rs changes for C++ wrapper
# recisdb = { path = "../recisdb-rs", default-features = false, features = ["bg-runtime"] }

tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
futures = "0.3"
futures-util = { version = "0.3", features = ["io"] }
futures-executor = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.7"
# OS CSPRNG for Web API token generation (REVIEW_2026-07.md S2). Already
# present in Cargo.lock as a transitive dependency (via rustls/ring), so this
# direct dependency adds no new crate to the build.
getrandom = "0.2"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
dns-lookup = "1.0"
# Self-update (web/api/update.rs): GitHub release archive extraction and
# in-place binary replacement.
flate2 = "1"
tar = "0.4"
self-replace = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# BonDriver support (Windows)
cpp_utils = "0.3.0"

# TLS support (optional)
tokio-rustls = { version = "0.25", optional = true }
rustls = { version = "0.22", optional = true }
rustls-pemfile = { version = "2", optional = true }
encoding_rs = "0.8.35"
b25-sys = { path = "../b25-sys", features = ["prioritized_card_reader"] }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8.0"
# インストール先フォルダ選択の「参照…」ボタン用のネイティブフォルダ選択
# ダイアログ (Windows専用機能のみ有効化。GTK/xdg-portal等の非Windows
# バックエンドは対応機種が全てWindows専用のpx4_drvのため不要)。
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["ioctl", "poll"] }
libc = "0.2"

[build-dependencies]
bindgen = { version = "0.71.1", default-features = false, features = ["runtime"] }
cc = { version = "1.2", features = ["parallel"] }
glob = "0.3"
